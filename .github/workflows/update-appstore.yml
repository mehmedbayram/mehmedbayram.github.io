name: Update App Store data and publish

on:
  schedule:
    - cron: '15 1 * * *' # 04:15 Europe/Istanbul
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - index.html
      - app-ads.txt
      - scripts/update_appstore.py
      - scripts/requirements.txt
      - .github/workflows/update-appstore.yml

permissions:
  contents: read

concurrency:
  group: appstore-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Prepare worldwide App Store snapshot
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import update_appstore as sync
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              # UI-only releases reuse the latest daily snapshot without querying 175 stores again.
              snapshot = sync.request_json('https://mehmedbayram.github.io/data/appstore.json')
              if snapshot.get('schemaVersion') != 2 or snapshot.get('scope') != 'worldwide' or len(snapshot.get('countries', [])) < 170:
                  raise RuntimeError('Published worldwide snapshot is unavailable')
              if snapshot.get('charts', {}).get('source') != 'product-pages':
                  snapshot['charts'] = sync.chart_snapshot(snapshot['apps'], snapshot['countries'])
              sync.write_site(Path.cwd(), Path('_site'), snapshot)
              print('Published using the latest daily worldwide snapshot.')
              raise SystemExit(0)
          sys.argv = ['sync', '--output', '_site']
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              sys.argv.append('--refresh-metadata')
          raise SystemExit(sync.main())
          PYCODE
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
